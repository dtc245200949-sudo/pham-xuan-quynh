<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="brand">🎬 MovieTicket</div>
        <nav class="nav-links">
          <a href="/home">Trang chủ</a>
          <a href="/login">Đăng nhập</a>
        </nav>
      </div>
    </header>

    <main class="auth-layout">
      <section class="auth-image">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&amp;fit=crop&amp;w=1800&amp;q=85" alt="Không gian rạp chiếu phim" />
        <div class="auth-image-copy">
          <p class="eyebrow">MOVIETICKET / RẠP PHIM CỦA BẠN</p>
          <h1>Đêm nay xem phim gì?</h1>
          <p>Tạo tài khoản để chọn phim và đặt ghế yêu thích.</p>
        </div>
      </section>
      <section class="auth-box">
        <h2>Đăng ký</h2>
        <form id="register-form">
          <label>Họ tên
            <input type="text" id="register-name" required />
          </label>
          <label>Email
            <input type="email" id="register-email" required />
          </label>
          <label>Mật khẩu
            <input type="password" id="register-password" required />
          </label>
          <button type="submit" style="margin-top: 16px;">Tạo tài khoản</button>
        </form>
        <p id="register-message"></p>
      </section>
    </main>

    <script src="/login.js"></script>
  </body>
</html>
