services:
  mysql:
    image: mysql:8.0
    container_name: movie_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MovieRoot_Local_Demo_Only_ChangeMe_2026!}
      MYSQL_DATABASE: movie_db
    volumes:
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - db-net

  db-user-init:
    image: mysql:8.0
    container_name: movie_db_user_init
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" -e
        "CREATE USER IF NOT EXISTS '$$MYSQL_APP_USER'@'%' IDENTIFIED BY '$$MYSQL_APP_PASSWORD';
        ALTER USER '$$MYSQL_APP_USER'@'%' IDENTIFIED BY '$$MYSQL_APP_PASSWORD';
        GRANT SELECT, INSERT, UPDATE, DELETE ON movie_db.* TO '$$MYSQL_APP_USER'@'%';
        CREATE USER IF NOT EXISTS '$$MYSQL_MONITOR_USER'@'%' IDENTIFIED BY '$$MYSQL_MONITOR_PASSWORD';
        ALTER USER '$$MYSQL_MONITOR_USER'@'%' IDENTIFIED BY '$$MYSQL_MONITOR_PASSWORD';
        GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO '$$MYSQL_MONITOR_USER'@'%';"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MovieRoot_Local_Demo_Only_ChangeMe_2026!}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-movie_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-MovieApp_Local_Demo_Only_ChangeMe_2026!}
      MYSQL_MONITOR_USER: ${MYSQL_MONITOR_USER:-movie_monitor}
      MYSQL_MONITOR_PASSWORD: ${MYSQL_MONITOR_PASSWORD:-MovieMonitor_Local_Demo_Only_ChangeMe_2026!}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - db-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: movie_phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MovieRoot_Local_Demo_Only_ChangeMe_2026!}
    ports:
      - "8080:80"
    networks:
      - app-net
      - db-net

  webapp:
    build: ./app
    image: ${DOCKERHUB_USERNAME:-phamquynh2006}/movie-ticket-app:latest
    container_name: movie_webapp
    environment:
      DB_HOST: mysql
      DB_USER: ${MYSQL_APP_USER:-movie_app}
      DB_PASS: ${MYSQL_APP_PASSWORD:-MovieApp_Local_Demo_Only_ChangeMe_2026!}
      DB_NAME: movie_db
    depends_on:
      mysql:
        condition: service_healthy
      db-user-init:
        condition: service_completed_successfully
    networks:
      - app-net
      - db-net

  nginx:
    build: ./nginx
    image: ${DOCKERHUB_USERNAME:-phamquynh2006}/movie-ticket-nginx:latest
    container_name: movie_nginx
    ports:
      - "8280:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - webapp
    networks:
      - app-net

  prometheus:
    image: prom/prometheus:latest
    container_name: movie_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - app-net
      - metrics-net

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: movie_mysqld_exporter
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=${MYSQL_MONITOR_USER:-movie_monitor}
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_MONITOR_PASSWORD:-MovieMonitor_Local_Demo_Only_ChangeMe_2026!}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net
      - db-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: movie_cadvisor
    privileged: true
    command:
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - app-net

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: movie_docker_socket_proxy
    environment:
      CONTAINERS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - metrics-net

  docker-metrics-exporter:
    build: ./metrics
    image: ${DOCKERHUB_USERNAME:-phamquynh2006}/movie-ticket-metrics-exporter:latest
    container_name: movie_docker_metrics_exporter
    depends_on:
      - docker-socket-proxy
    networks:
      - metrics-net

  loki:
    image: grafana/loki:latest
    container_name: movie_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - app-net

  promtail:
    image: grafana/promtail:latest
    container_name: movie_promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - app-net

  grafana:
    image: grafana/grafana:latest
    container_name: movie_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-MovieGrafana_Local_Demo_Only_ChangeMe_2026!}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - app-net

volumes:
  grafana_data:
  prometheus_data:

networks:
  app-net:
    driver: bridge
  db-net:
    driver: bridge
    internal: true
  metrics-net:
    driver: bridge
    internal: true